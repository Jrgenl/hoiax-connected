name: Release

# Creates a GitHub release (and tag) automatically whenever the version in
# manifest.json is bumped on main. No manual tagging needed.
on:
  push:
    branches: [main]
    paths:
      - custom_components/hoiax/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(jq -r .version custom_components/hoiax/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          (cd custom_components/hoiax && zip -r ../../hoiax.zip .)
          gh release create "v$VERSION" hoiax.zip \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
