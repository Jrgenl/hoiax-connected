name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/hoiax/manifest.json > m.json
          mv m.json custom_components/hoiax/manifest.json
      - name: Zip integration
        run: cd custom_components/hoiax && zip -r ../../hoiax.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: hoiax.zip
